<div class="teaching-entry">
  <div class="teaching-title">
    {% if post.url %}<a href="{{ post.url }}">{{ post.title }}</a>{% else %}{{ post.title }}{% endif %}
    {% if post.role %}<span class="teaching-role">{{ post.role }}</span>{% endif %}
  </div>
  <div class="teaching-meta">
    <em>{{ post.venue }}</em>
    <span class="teaching-year">{% if post.years %}{{ post.years }}{% else %}{{ post.date | date: "%Y" }}{% endif %}</span>
    {% if post.location %}<span class="teaching-location">{{ post.location }}</span>{% endif %}
  </div>
</div>
